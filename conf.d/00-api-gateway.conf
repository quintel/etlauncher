# MyETM's API gateway passes calls under /api/v4/saved_scenarios/:id/ through to the Scenario's engine. The
# locations live in MyETM's vhost.d file. These directives are only valid at http level.

# Caps each caller's concurrent calls through the gateway. limit_conn runs before auth_request, so the caller is
# their bearer, or their address when anonymous. A PAT outgrows limit_conn's 255 byte key, so the
# key is the bearer's last 64 characters, which fall in its signature.
map $http_authorization $api_gateway_caller {
    ""                       $binary_remote_addr;
    "~(?<bearer_tail>.{1,64})$" $bearer_tail;
}

# The path the caller asked for, which the refusal renderer's rewrite would otherwise replace.
map $request_uri $api_gateway_path {
    "~^(?<requested_path>[^?]*)" $requested_path;
}

limit_conn_zone $api_gateway_caller zone=api_gateway:10m;

# Any bearer opens its own count before the verdict, so each address also has a ceiling.
limit_conn_zone $binary_remote_addr zone=api_gateway_address:10m;

# The engine token the verdict gave, as a header value. Empty sends no Authorization at all.
map $api_gateway_engine_token $api_gateway_authorization {
    default "Bearer $api_gateway_engine_token";
    ""      "";
}

# nginx-proxy names an upstream after each host it serves, and a bare origin would match it and skip
# TLS. Naming the port stops that match, so the engine is reached through its own front.
map $api_gateway_engine_origin $api_gateway_engine_address {
    "~^https://[^:/]+$" "$api_gateway_engine_origin:443";
    default             $api_gateway_engine_origin;
}

# A refused verdict names no user, so only a caller with no bearer is logged as anonymous.
map $api_gateway_user_id $api_gateway_user {
    default $api_gateway_user_id;
    ""      $api_gateway_unidentified;
}

map $http_authorization $api_gateway_unidentified {
    default "";
    ""      anonymous;
}

log_format api_gateway escape=json '{"log":"etm_api_gateway",'
    '"time":"$time_iso8601",'
    '"user_id":"$api_gateway_user",'
    '"pat_id":"$api_gateway_pat_id",'
    '"version":"$api_gateway_version",'
    '"method":"$request_method",'
    '"path":"$api_gateway_path",'
    '"status":$status,'
    '"upstream_response_time":"$upstream_response_time",'
    '"request_time":$request_time,'
    '"user_agent":"$http_user_agent"}';
