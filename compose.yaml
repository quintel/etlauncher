# ETLauncher — local development orchestration. Source comes from sibling checkouts
# (../etengine, ../etmodel, ...). See README for the networking/hostname rationale.
#
#   cp .env.example .env && ./bin/up
#
# Two networks mirror prod: etm-internal (etengine, etmodel, collections,
# workspace + the shared MySQL `database`; ≈ prod's private `default`) and etm-public
# (myetm + the version apps + `database`, dual-homed; ≈ prod's external nginx-proxy).
# MyETM is public-only so the bidirectional OIDC handshake resolves. One `database`
# container holds every app's DB, mirroring prod's one MySQL per server.

name: etlauncher

x-mysql-env: &mysql-env
  DATABASE_HOST: database
  MYSQL_USER: root
  MYSQL_PASSWORD: ${DB_ROOT_PASSWORD}

services:
  database:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'   # allow root from the app containers (default is localhost-only)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/mysql
    networks:
      etm-internal:
        aliases: [database]
      etm-public:
        aliases: [database]

  etengine:
    build:
      context: ../etengine
    # app-boot.sh warms gems from a named volume and applies DEV_GEMS, then execs the
    # server command. entrypoint.sh runs puma (binds 3000).
    command: ["app-boot.sh", ".docker/entrypoint.sh"]
    environment:
      <<: *mysql-env
      RAILS_ENV: development
      MYSQL_DATABASE: etengine_development    # db:prepare also creates _queue_ and _cache_
      ETSOURCE_PATH: /etsource
      ETM_HOST_PARENT: ${ETM_HOST_PARENT}
      SSO_COOKIE_SUFFIX: ${SSO_COOKIE_SUFFIX:-}
      ETSOURCE_LIVE_RELOAD_FORCE_POLLING: "true"
      # Accept the bare "etengine" alias co-located apps use on etm-internal. Development
      # restricts config.hosts to ETM_HOST_PARENT, so without this a service-name request
      # is rejected; the deployed environments leave config.hosts empty and accept it.
      RAILS_DEVELOPMENT_HOSTS: etengine
    ports:
      - "3000:3000"
    volumes:
      - ../etengine:/app:cached
      - ../etsource:/etsource:cached
      - ./overrides/etengine.settings.local.yml:/app/config/settings.local.yml:ro
      - ./bin/app-boot.sh:/usr/local/bin/app-boot.sh:ro
      - etengine_bundle:/usr/local/bundle
      - etengine_node_modules:/app/node_modules
      - etengine_packs:/app/public/packs
      - etengine_cache:/app/tmp/cache
      - etengine_storage:/app/storage
    tmpfs:
      - /tmp
      - /app/tmp/pids
      - /app/tmp/cache/assets
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      database:
        condition: service_healthy
    networks:
      etm-internal:
        aliases: [etengine, etengine.local.energytransitionmodel.com]
      etm-public:
        aliases: [etengine.local.energytransitionmodel.com]

  etmodel:
    build:
      context: ../etmodel
    # yarn install self-heals the shared etmodel_node_modules volume on a
    # package.json/yarn.lock change (the volume doesn't auto-refresh from a rebuilt
    # image); --frozen-lockfile keeps it deterministic. JS packs then compile on
    # demand per-request (config/shakapacker.yml has compile: true) — no dev server.
    command: ["app-boot.sh", "sh", "-c", "yarn install --frozen-lockfile && exec ./bin/rails s -b 0.0.0.0 -p 3001"]
    environment:
      <<: *mysql-env
      RAILS_ENV: development
      MYSQL_DATABASE: etmodel_development
      ETM_HOST_PARENT: ${ETM_HOST_PARENT}
      SSO_COOKIE_SUFFIX: ${SSO_COOKIE_SUFFIX:-}
      # Reach etengine by its service name on etm-internal rather than the public host,
      # as the deployed environments do, so Settings.ete_internal_url is the branch
      # exercised locally too.
      ETE_INTERNAL_URL: http://etengine:3000
      # Accept the bare "etmodel" alias collections uses on etm-internal.
      RAILS_DEVELOPMENT_HOSTS: etmodel
    ports:
      - "3001:3001"
    volumes:
      - ../etmodel:/app:cached
      - ./overrides/etmodel.settings.local.yml:/app/config/settings.local.yml:ro
      - ./bin/app-boot.sh:/usr/local/bin/app-boot.sh:ro
      - etmodel_bundle:/usr/local/bundle
      - etmodel_node_modules:/app/node_modules
      - etmodel_packs:/app/public/packs
      - etmodel_cache:/app/tmp/cache
      - etmodel_storage:/app/storage
    tmpfs:
      - /tmp
      - /app/tmp/pids
      - /app/tmp/cache/assets
    depends_on:
      database:
        condition: service_healthy
      etengine:
        condition: service_started
    networks:
      etm-internal:
        aliases: [etmodel, etmodel.local.energytransitionmodel.com]
      etm-public:
        aliases: [etmodel.local.energytransitionmodel.com]

  my-etm:
    build:
      context: ../my-etm
    command: ["app-boot.sh", "bundle", "exec", "rails", "server", "-b", "0.0.0.0", "-p", "3002"]
    environment:
      <<: *mysql-env
      RAILS_ENV: development
      MYSQL_DATABASE: my_etm_development
      ETM_HOST_PARENT: ${ETM_HOST_PARENT}
      OPENID_ISSUER: ${MYETM_URL}            # pins token `iss`; OIDC endpoints follow request Host
      SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN} # parent domain for the shared etm_session cookie
      SSO_COOKIE_SUFFIX: ${SSO_COOKIE_SUFFIX:-} # suffixes the session cookie names
      # Consumed by bin/seed-oauth (runs inside this container):
      ETMODEL_CLIENT_ID: ${ETMODEL_CLIENT_ID}
      ETMODEL_CLIENT_SECRET: ${ETMODEL_CLIENT_SECRET}
      ETENGINE_CLIENT_ID: ${ETENGINE_CLIENT_ID}
      ETENGINE_CLIENT_SECRET: ${ETENGINE_CLIENT_SECRET}
      # Consumed by bin/seed-users (runs inside this container):
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      USER_EMAIL: ${USER_EMAIL}
      USER_PASSWORD: ${USER_PASSWORD}
    ports:
      - "3002:3002"
    volumes:
      - ../my-etm:/app:cached
      - ./overrides/myetm.settings.local.yml:/app/config/settings.local.yml:ro
      - ./bin/app-boot.sh:/usr/local/bin/app-boot.sh:ro
      - myetm_bundle:/usr/local/bundle
      - myetm_cache:/app/tmp/cache
      - myetm_storage:/app/storage
    tmpfs:
      - /tmp
      - /app/tmp/pids
      - /app/tmp/cache/assets
    depends_on:
      database:
        condition: service_healthy
    networks:
      etm-public:
        aliases: [myetm, myetm.local.energytransitionmodel.com]

  collections:
    image: node:20-alpine
    working_dir: /app
    # next dev reads NEXT_PUBLIC_* at runtime, so a URL change needs no rebuild.
    command: sh -c "yarn install --frozen-lockfile && yarn dev -p 3005 -H 0.0.0.0"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_ETENGINE_URL: ${ETENGINE_URL}
      NEXT_PUBLIC_ETMODEL_URL: ${ETMODEL_URL}
      NEXT_PUBLIC_MYETM_URL: ${MYETM_URL}
      NEXT_PUBLIC_SSO_COOKIE_SUFFIX: ${SSO_COOKIE_SUFFIX:-}
      # Server-side base URLs the API routes read in preference to the NEXT_PUBLIC_ values
      # above, reaching both apps by service name on etm-internal as the deployed
      # environments do. etmodel answers on 3001 here, unlike 3000 on the servers.
      ETENGINE_INTERNAL_URL: http://etengine:3000
      ETMODEL_INTERNAL_URL: http://etmodel:3001
    ports:
      - "3005:3005"
    volumes:
      - ../multi-year-charts:/app:cached
      - collections_node_modules:/app/node_modules
    depends_on:
      my-etm:
        condition: service_started
      etengine:
        condition: service_started
    networks:
      etm-internal:
        aliases: [collections, collections.local.energytransitionmodel.com]
      etm-public:
        aliases: [collections.local.energytransitionmodel.com]

  # Managed dev shell — the dev-container target. Toolchain only; run app
  # commands against the services (e.g. `docker compose exec etengine bin/rails c`).
  workspace:
    build:
      context: ./devshell
    command: sleep infinity
    volumes:
      - ..:/workspace:cached                 # parent dir = all sibling repos + ETLauncher
    networks:
      - etm-internal
      - etm-public

networks:
  etm-internal:
    driver: bridge
  etm-public:
    driver: bridge

volumes:
  db_data:
  etengine_bundle:
  etengine_node_modules:
  etengine_packs:
  etengine_cache:
  etengine_storage:
  etmodel_bundle:
  etmodel_node_modules:
  etmodel_packs:
  etmodel_cache:
  etmodel_storage:
  myetm_bundle:
  myetm_cache:
  myetm_storage:
  collections_node_modules:
